name: "Build"

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: "always"

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Type check"
        run: |
          cargo check

      - name: "Test"
        run: |
          cargo test

      - name: "Lint"
        run: |
          cargo clippy
